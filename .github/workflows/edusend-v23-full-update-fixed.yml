      - name: Verify files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/app.js
          test -s public/service-worker.js
          test -s server.js
          test -s package.json
          node --check server.js
          node --check public/app.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Commit replacement files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EduSend Updater"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/service-worker.js server.js package.json
          if git diff --cached --quiet; then
            echo "Repository already contains this EduSend V2.3 update."
            exit 0
          fi
          git commit -m "Update EduSend to V2.3"
          git push origin HEAD:main
