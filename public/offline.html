<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2f6b">
  <title>EduSend — Offline</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#14213d;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    .card{max-width:520px;background:white;border:1px solid #dbe3ef;border-radius:20px;padding:28px;box-shadow:0 18px 50px #1232;text-align:center}
    img{width:88px;height:88px;border-radius:20px}.muted{color:#667085;line-height:1.55}button{border:0;background:#0b2f6b;color:white;font-weight:700;padding:12px 18px;border-radius:12px}
  </style>
</head>
<body><div class="card"><img src="/icons/icon-192.png" alt="EduSend"><h1>EduSend is offline</h1><p class="muted">The installed app can open without data, but live school results, login verification and result submission need a connection to the EduSend server.</p><button onclick="location.reload()">Try again</button></div></body>
</html>
