<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2f6b"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>EduSend</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css?v=3.1.13"></head><body><div id="app"></div><noscript>EduSend requires JavaScript.</noscript><script src="/app.js?v=3.1.13" defer></script><script>
(async()=>{if(!('serviceWorker' in navigator))return;const V='3.1.13',K='edusend_asset_version';try{if(localStorage.getItem(K)!==V){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('edusend-')).map(k=>caches.delete(k)));}localStorage.setItem(K,V);}const reg=await navigator.serviceWorker.register('/service-worker.js?v='+V,{updateViaCache:'none'});reg.update();}catch(e){console.warn('Service worker refresh failed',e);}})();
</script></body></html>
